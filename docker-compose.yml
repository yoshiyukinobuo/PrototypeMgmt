services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: prototype
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - dbdata:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_DSN: app:app@tcp(db:3306)/prototype?parseTime=true&charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_PASS: ${ADMIN_PASS:?set ADMIN_PASS in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ERP_URL: ${ERP_URL:-}
      ERP_API_KEY: ${ERP_API_KEY:-}
      ERP_API_SECRET: ${ERP_API_SECRET:-}
      ERP_COMPANY: ${ERP_COMPANY:-}
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["8081:80"]
    depends_on: [backend]

volumes:
  dbdata:
